<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>Калории</title>
<style>
:root{--bg:#0a0a12;--card:#141420;--line:#24243a;--tx:#f4f4fa;--mut:#9a9ab3;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Inter","Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(420px 320px at 10% 0%,rgba(139,92,246,.28),transparent 70%),radial-gradient(380px 300px at 100% 20%,rgba(34,211,238,.20),transparent 70%),radial-gradient(420px 340px at 30% 100%,rgba(244,114,182,.20),transparent 70%)}
main{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:20px 20px 48px}
h1{font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:0 0 22px;text-align:center;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:4px;margin:6px auto 18px;max-width:240px}
.tabs button{flex:1;padding:9px;border-radius:999px;background:none;color:var(--mut);font-weight:600;font-size:14px}
.tabs button.on{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;box-shadow:0 4px 16px rgba(139,92,246,.45)}
.ring{position:relative;width:240px;height:240px;margin:0 auto 28px;animation:in .8s ease both;filter:drop-shadow(0 0 22px rgba(139,92,246,.45))}
svg{display:block;transform:rotate(-90deg)}
circle{fill:none;stroke-width:12;stroke-linecap:round}
.bg{stroke:var(--line)}
.fg{stroke:url(#g);stroke-dasharray:659.73;stroke-dashoffset:659.73;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.n{font-size:58px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#fff,#c4b5fd 60%,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.s{font-size:14px;color:var(--mut);margin-top:2px}
.card{background:rgba(20,20,32,.85);border:1px solid var(--line);border-radius:20px;padding:14px;animation:in .8s .15s ease both;backdrop-filter:blur(8px)}
.row{display:flex;gap:8px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;min-width:0;transition:border-color .25s,box-shadow .25s}
input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.2)}
#k{width:96px}#t{flex:1}
button{font:inherit;cursor:pointer;border:0;transition:transform .2s,opacity .2s,background .2s}
button:active{transform:scale(.96)}
.add{width:100%;margin-top:8px;padding:14px;border-radius:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,#8b5cf6,#ec4899 60%,#fb923c);box-shadow:0 6px 22px rgba(236,72,153,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;animation:in .8s .3s ease both}
.chip{background:rgba(20,20,32,.85);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:8px 14px 8px 12px;font-size:13px;display:flex;align-items:center;gap:8px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.chip:hover{border-color:var(--c)}
ul{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
li{display:flex;align-items:center;gap:10px;padding:14px 8px 14px 16px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.10);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 8px 20px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.4);animation:slide .45s cubic-bezier(.2,.8,.2,1) both}
li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .kc{color:#c4b5fd;font-variant-numeric:tabular-nums;font-weight:600}
.x{background:none;color:var(--mut);font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--tx)}
.empty{text-align:center;color:var(--mut);font-size:14px;margin-top:28px}
.hide{display:none}
.bars{display:flex;align-items:flex-end;gap:8px;height:220px;padding:0 2px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.col .v{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;min-height:14px}
.col .b{width:100%;border-radius:10px 10px 6px 6px;height:0;transition:height .9s cubic-bezier(.2,.8,.2,1);min-height:4px;opacity:.95}
.col .d{font-size:12px;color:var(--mut);font-weight:600}
.col.today .d{color:#fff}
.col.today .b{box-shadow:0 0 18px var(--c)}
.sum{display:flex;gap:10px;margin-top:26px}
.sum div{flex:1;background:rgba(20,20,32,.85);border:1px solid var(--line);border-radius:18px;padding:14px}
.sum b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sum span{font-size:12px;color:var(--mut)}
.qe{margin-top:30px}
.qe summary{list-style:none;cursor:pointer;text-align:center;color:var(--mut);font-size:13px;padding:10px}
.qe summary::-webkit-details-marker{display:none}
.qe[open] summary{color:var(--tx)}
.qe .chips{animation:none;margin:6px 0 14px}
.qx{background:none;color:var(--mut);font-size:18px;line-height:1;padding:0 2px;margin-left:2px}
.qx:hover{color:var(--tx)}
#qk{width:96px}#qn{flex:1}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="tabs"><button id="tD" class="on">День</button><button id="tW">Неделя</button></div>
  <h1 id="day"></h1>

  <section id="dayView">
    <div class="ring">
      <svg viewBox="0 0 240 240" width="240" height="240" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".4" stop-color="#8b5cf6"/><stop offset=".75" stop-color="#ec4899"/><stop offset="1" stop-color="#fb923c"/></linearGradient></defs>
        <circle class="bg" cx="120" cy="120" r="105"/>
        <circle class="fg" id="fg" cx="120" cy="120" r="105"/>
      </svg>
      <div class="c"><div class="n" id="n">0</div><div class="s">ккал за сегодня</div></div>
    </div>
    <div class="card">
      <div class="row">
        <input id="k" type="number" inputmode="numeric" min="1" max="5000" placeholder="ккал">
        <input id="t" type="text" maxlength="40" placeholder="Что съел (по желанию)">
      </div>
      <button class="add" id="add">Добавить</button>
    </div>
    <div class="chips" id="chips"></div>
    <ul id="list"></ul>
    <p class="empty" id="empty">Пока ничего не добавлено</p>
  </section>

  <section id="weekView" class="hide">
    <div class="bars" id="bars"></div>
    <div class="sum"><div><b id="wt">0</b><span>всего за неделю</span></div><div><b id="wa">0</b><span>в среднем в день</span></div></div>
    <details class="qe">
      <summary>Быстрые кнопки ▾</summary>
      <div class="chips" id="qlist"></div>
      <div class="card">
        <div class="row">
          <input id="qn" type="text" maxlength="24" placeholder="Название">
          <input id="qk" type="number" inputmode="numeric" min="1" max="5000" placeholder="ккал">
        </div>
        <button class="add" id="qa">Добавить кнопку</button>
      </div>
    </details>
  </section>
</main>
<script>
const C = 659.73, GOAL = 1700;
const $ = id => document.getElementById(id);
const dk = d => 'cal:' + d.toLocaleDateString('sv');
const read = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch (e) { return []; } };
const key = dk(new Date());
let items = read(key);
const save = () => { try { localStorage.setItem(key, JSON.stringify(items)); } catch (e) {} };
$('day').textContent = new Date().toLocaleDateString('ru-RU', { weekday: 'long' });

const PAL = ['#fb923c', '#4ade80', '#facc15', '#f472b6', '#a78bfa', '#22d3ee', '#fdba74', '#f87171'];
const defQuick = [['Кофе с молоком', 105, '#fb923c'], ['Яблоко', 80, '#4ade80'], ['Банан', 90, '#facc15'], ['Творожок', 150, '#f472b6'], ['Печенье', 225, '#a78bfa'], ['Мандарин', 40, '#fdba74']];
let quick = defQuick;
try { const q = JSON.parse(localStorage.getItem('quick')); if (Array.isArray(q)) quick = q; } catch (e) {}
const saveQuick = () => { try { localStorage.setItem('quick', JSON.stringify(quick)); } catch (e) {} };

function renderChips() {
  $('chips').innerHTML = ''; $('qlist').innerHTML = '';
  quick.forEach(([name, kcal, col], idx) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.style.setProperty('--c', col);
    const i = document.createElement('i');
    b.append(i, name + ' · ' + kcal);
    b.onclick = () => addItem(name, kcal);
    $('chips').appendChild(b);

    const e = document.createElement('div');
    e.className = 'chip'; e.style.setProperty('--c', col);
    const i2 = document.createElement('i');
    const x = document.createElement('button'); x.className = 'qx'; x.textContent = '×'; x.setAttribute('aria-label', 'Удалить кнопку');
    x.onclick = () => { quick.splice(idx, 1); saveQuick(); renderChips(); };
    e.append(i2, name + ' · ' + kcal, x);
    $('qlist').appendChild(e);
  });
}
$('qa').onclick = () => {
  const n = $('qn').value.trim(), k = parseInt($('qk').value, 10);
  if (!n) { $('qn').focus(); return; }
  if (!k || k < 1 || k > 5000) { $('qk').focus(); return; }
  quick.push([n, k, PAL[quick.length % PAL.length]]);
  saveQuick(); renderChips();
  $('qn').value = ''; $('qk').value = '';
};
['qn', 'qk'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('qa').click(); }));
renderChips();

let shown = 0;
function countTo(to) {
  const from = shown, t0 = performance.now(), d = 700;
  (function step(t) {
    const p = Math.min((t - t0) / d, 1), e = 1 - Math.pow(1 - p, 3);
    shown = Math.round(from + (to - from) * e);
    $('n').textContent = shown;
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

function render(animateList) {
  const total = items.reduce((a, i) => a + i.k, 0);
  $('fg').style.strokeDashoffset = C * (1 - Math.min(total / GOAL, 1));
  countTo(total);
  $('empty').style.display = items.length ? 'none' : 'block';
  const ul = $('list'); ul.innerHTML = '';
  items.slice().reverse().forEach((it, idx) => {
    const li = document.createElement('li');
    if (!animateList || idx > 0) li.style.animation = 'none';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = it.n || 'Без названия';
    const kc = document.createElement('span'); kc.className = 'kc'; kc.textContent = it.k + ' ккал';
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', 'Удалить');
    x.onclick = () => { items = items.filter(o => o.id !== it.id); save(); render(false); };
    li.append(nm, kc, x); ul.appendChild(li);
  });
}

function addItem(name, kcal) {
  kcal = parseInt(kcal, 10);
  if (!kcal || kcal < 1 || kcal > 5000) { $('k').focus(); return; }
  items.push({ id: Date.now() + Math.random(), n: (name || '').trim(), k: kcal });
  save(); render(true);
}
$('add').onclick = () => { addItem($('t').value, $('k').value); $('k').value = ''; $('t').value = ''; };
['k', 't'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('add').click(); }));

const DN = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'], HUE = [190, 225, 260, 295, 330, 15, 45];
function renderWeek() {
  const now = new Date(), off = (now.getDay() + 6) % 7, vals = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(now); d.setDate(now.getDate() - off + i);
    vals.push(read(dk(d)).reduce((a, b) => a + b.k, 0));
  }
  const mx = Math.max(...vals, 1), tot = vals.reduce((a, b) => a + b, 0), days = vals.filter(v => v > 0).length;
  const box = $('bars'); box.innerHTML = '';
  const bars = [];
  vals.forEach((v, i) => {
    const col = document.createElement('div'); col.className = 'col' + (i === off ? ' today' : '');
    const c = 'hsl(' + HUE[i] + ' 90% 62%)'; col.style.setProperty('--c', c);
    const val = document.createElement('div'); val.className = 'v'; val.textContent = v || '';
    const b = document.createElement('div'); b.className = 'b';
    b.style.background = 'linear-gradient(to top, hsl(' + HUE[i] + ' 90% 52%), hsl(' + HUE[i] + ' 95% 72%))';
    const d = document.createElement('div'); d.className = 'd'; d.textContent = DN[i];
    col.append(val, b, d); box.appendChild(col); bars.push([b, v]);
  });
  $('wt').textContent = tot; $('wa').textContent = days ? Math.round(tot / days) : 0;
  requestAnimationFrame(() => requestAnimationFrame(() => bars.forEach(([b, v]) => { b.style.height = (v / mx * 150) + 'px'; })));
}

function tab(week) {
  $('tD').classList.toggle('on', !week); $('tW').classList.toggle('on', week);
  $('dayView').classList.toggle('hide', week); $('weekView').classList.toggle('hide', !week);
  if (week) renderWeek();
}
$('tD').onclick = () => tab(false);
$('tW').onclick = () => tab(true);

requestAnimationFrame(() => requestAnimationFrame(() => render(false)));
</script>
</body>
</html>
